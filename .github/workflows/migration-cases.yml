name: "Migrate cases"
on:
  workflow_dispatch:

  schedule:
    # All all-cases courts (live): hourly weekdays.
    - cron:  '0 10-19/1 * * 1-5'

jobs:
  migrate_cases:
    # Run this shared job on the hourly cron; allow manual dispatch too.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10-19/1 * * 1-5' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        court: [madera,mariposa,solano]
        # court: [madera,mariposa,solano,mono,contracosta]  # uncomment (and remove line above) when mono and contracosta are promoted from epic-uat to live
        server: [live]
    name: ${{ matrix.court }}.${{ matrix.server }}

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.PANTHEON_SSH_KEY }}
          config: ${{ secrets.SSH_CONFIG }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
      - name: Install Terminus
        uses: pantheon-systems/terminus-github-actions@main
        with:
          pantheon-machine-token: ${{ secrets.PANTHEON_MACHINE_TOKEN }}
      - name: Stop running migrations
        continue-on-error: true
        run: |
          terminus drush jcc-${{ matrix.court }}.${{ matrix.server }} -- migrate:stop case_node_all_cases
      - name: Reset migrations
        continue-on-error: true
        run: |
          terminus drush jcc-${{ matrix.court }}.${{ matrix.server }} -- migrate:reset case_node_all_cases
      - name: Rollback migrations
        continue-on-error: true
        run: |
          terminus drush jcc-${{ matrix.court }}.${{ matrix.server }} -- migrate:rollback case_node_all_cases
      - name: Migrate cases
        continue-on-error: true
        run: terminus drush jcc-${{ matrix.court }}.${{ matrix.server }} -- migrate:import case_node_all_cases --limit=10000
      - name: Clear cache
        continue-on-error: true
        run: terminus drush jcc-${{ matrix.court }}.${{ matrix.server }} -- cr

